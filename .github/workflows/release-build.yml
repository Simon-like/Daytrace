name: release-build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      packages: write
    environment: release-build
    steps:
      - name: Check out the exact trusted main SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify trusted CI provenance and main ancestry
        env:
          EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/ci/verify-trusted-main.mjs
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_GIT_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"
      - uses: ./.github/actions/setup-workspace
      - name: Build trusted linux/amd64 images
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}/daytrace"
          echo "IMAGE_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -f ops/cicd/docker/api.Dockerfile -t "$PREFIX/api:$GIT_SHA" .
          docker build --platform linux/amd64 -f ops/cicd/docker/site.Dockerfile -t "$PREFIX/site:$GIT_SHA" .
      - name: Block fixable high and critical API image vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/api:${{ github.event.workflow_run.head_sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Block fixable high and critical site image vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/site:${{ github.event.workflow_run.head_sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Smoke both images before registry push
        run: bash ops/cicd/container-smoke.sh "${IMAGE_PREFIX}/api:${{ github.event.workflow_run.head_sha }}" "${IMAGE_PREFIX}/site:${{ github.event.workflow_run.head_sha }}" ops/cicd/.artifacts/content-revision
      - name: Push the tested image pair
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/api:$GIT_SHA"
          docker push "$IMAGE_PREFIX/site:$GIT_SHA"
          API_IMAGE="$(docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_PREFIX/api:$GIT_SHA" | jq -r --arg prefix "$IMAGE_PREFIX/api@" 'map(select(startswith($prefix)))[0] // empty')"
          SITE_IMAGE="$(docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_PREFIX/site:$GIT_SHA" | jq -r --arg prefix "$IMAGE_PREFIX/site@" 'map(select(startswith($prefix)))[0] // empty')"
          test -n "$API_IMAGE" && test -n "$SITE_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "SITE_IMAGE=$SITE_IMAGE" >> "$GITHUB_ENV"
      - name: Generate immutable release manifest
        env:
          RELEASE_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          TARGET_ARCHITECTURE: linux/amd64
        run: |
          export CONTENT_REVISION="$(cat ops/cicd/.artifacts/content-revision)"
          export BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/ci/release-manifest.mjs --output ops/cicd/.artifacts/release/manifest.json
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: ops/cicd/.artifacts/release/manifest.json
          if-no-files-found: error
          retention-days: 30
