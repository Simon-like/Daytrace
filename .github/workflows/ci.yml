name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install workflow test parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Repository and collaboration checks
        run: |
          python3 scripts/project_check.py
          python3 -m unittest discover -s tests/foundation -v
          python3 -m unittest discover -s tests/cicd -v
      - name: Delivery script unit tests and shell syntax
        run: |
          node --test tests/cicd/*.test.mjs
          bash -n ops/cicd/remote-deploy.sh ops/cicd/host-deploy.sh ops/cicd/container-smoke.sh

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - name: Block known high-severity dependency vulnerabilities
        run: pnpm audit --audit-level high

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - name: Verify standalone tracing and copy static assets
        run: node scripts/ci/prepare-standalone.mjs

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - run: node scripts/ci/prepare-standalone.mjs
      - name: Scan public artifacts, HTML, RSC, API, and logs
        run: node scripts/ci/privacy-check.mjs
      - name: Upload sanitized privacy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-report
          path: tests/cicd/.artifacts/privacy-report.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:e2e
      - name: Install Chromium for real browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise integrated demo in a real browser
        run: DEMO_MANAGED_SERVER=1 pnpm test:browser
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-browser-evidence
          path: docs/project/evidence/DEMO-001/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: CI
    if: always()
    needs: [repo, static, unit, integration, build, privacy, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e 'const needs=JSON.parse(process.env.NEEDS); const failed=Object.entries(needs).filter(([,job])=>job.result!=="success"); if(failed.length){console.error(failed);process.exit(1)} console.log("All required CI groups passed")'
